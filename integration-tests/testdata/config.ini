[server]
LISTEN_ADDRESS = 127.0.0.1:3356
EXTERNAL_URL = http://127.0.0.1:3356

[database]
PASSWORD = ${LFSD_DATABASE_PASSWORD}

[storage "r2"]
TYPE = s3-presign
SCHEME = r2://
BUCKET = ${LFSD_R2_BUCKET}
ACCESS_KEY_ID = ${LFSD_R2_ACCESS_KEY_ID}
SECRET_ACCESS_KEY = ${LFSD_R2_SECRET_ACCESS_KEY}
ENDPOINT = https://${LFSD_R2_ACCOUNT_ID}.r2.cloudflarestorage.com

[forge "github.com"]
TYPE = github
STORAGE = r2
REPO_ALLOWLIST = unknwon/git-lfs-test

; Serves the same repository under another name, so that the test uploads the
; same object to two repositories. lfsd only listens on localhost in tests.
[forge "local.test"]
SKIP_AUTH = true
STORAGE = r2
REPO_ALLOWLIST = unknwon/git-lfs-test
