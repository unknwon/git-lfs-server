[server]
; Address for the HTTP server to listen on.
LISTEN_ADDRESS = 0.0.0.0:3356
; External-facing URL of the server.
EXTERNAL_URL = http://localhost:3356
; Maximum size in bytes for a single LFS object upload. Defaults to 5 GiB.
MAX_OBJECT_SIZE = 5368709120

[database]
; PostgreSQL host address.
HOST = 127.0.0.1
; PostgreSQL port.
PORT = 5432
; Database name.
NAME = lfsd
; Database user.
USER = lfsd
; Database password.
PASSWORD = ${LFSD_DATABASE_PASSWORD}
; PostgreSQL SSL mode: disable, require, verify-ca, verify-full.
SSL_MODE = disable
; Maximum number of open connections to the database.
MAX_OPEN_CONNS = 25
; Maximum number of idle connections in the pool.
MAX_IDLE_CONNS = 25
; Maximum lifetime of a connection in minutes. Connections older than this are
; closed and replaced. Set to 0 to disable.
CONN_MAX_LIFETIME = 30
; Maximum idle time of a connection in minutes. Idle connections older than this
; are closed. Set to 0 to disable.
CONN_MAX_IDLE_TIME = 5

[storage "local"]
TYPE = filesystem
; The scheme of the object URI, e.g., "file:///mnt/lfs-object/71/20/71205e4480342d973ab4611d557e812dc8f38731d6f407a7d43eda7a5af5b562".
SCHEME = file://
; Filesystem path where local LFS objects are stored.
ROOT = .data/objects
; Filesystem path for temporary files during upload. Must live on the same
; filesystem as ROOT (atomic rename requirement).
TEMP_DIR = %(ROOT)s/.tmp

; Example Cloudflare R2 storage configuration.
; [storage "r2"]
; TYPE = s3-presign
; ; The scheme of the object URI, e.g., "r2://lfs-objects/71205e4480342d973ab4611d557e812dc8f38731d6f407a7d43eda7a5af5b562".
; SCHEME = r2://
; ; R2 account ID (from Cloudflare dashboard).
; ACCOUNT_ID = ${LFSD_R2_ACCOUNT_ID}
; ; R2 bucket name. Must already exist.
; BUCKET = lfs-objects
; ; Access key ID for an R2 API token with read/write on BUCKET.
; ACCESS_KEY_ID = ${LFSD_R2_ACCESS_KEY_ID}
; ; Secret access key for the R2 API token.
; SECRET_ACCESS_KEY = ${LFSD_R2_SECRET_ACCESS_KEY}
; ; Endpoint URL to R2.
; ENDPOINT = https://%(ACCOUNT_ID)s.r2.cloudflarestorage.com

; Example forge configuration. Copy into your override config file and adjust
; the values. At least one forge must be configured. STORAGE references a
; [storage "{name}"] section by its name.
; [forge "github.com"]
; TYPE = github
; STORAGE = local
; Set true to bypass forge token verification entirely.
; SKIP_AUTH = false
; Optional. Comma-separated list of repository paths allowed on this forge,
; matched against the path portion of the URL after the host
; (case-insensitive). A trailing "/**" matches any non-empty suffix. Empty
; or unset accepts all repos. Example: "myorg/**, otherorg/specific-repo".
; REPO_ALLOWLIST =

[log]
; Default log level: debug, info, warn, error.
LEVEL = debug
