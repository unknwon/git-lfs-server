[server]
; Address for the HTTP server to listen on.
LISTEN_ADDRESS = 0.0.0.0:3356
; External-facing URL of the server.
EXTERNAL_URL = http://localhost:3356
; Maximum size in bytes for a single LFS object upload. Defaults to 5 GiB.
MAX_OBJECT_SIZE = 5368709120

[database]
; PostgreSQL host address.
HOST = 127.0.0.1
; PostgreSQL port.
PORT = 5432
; Database name.
NAME = lfsd
; Database user.
USER = lfsd
; Database password.
PASSWORD = ${LFSD_DATABASE_PASSWORD}
; PostgreSQL SSL mode: disable, require, verify-ca, verify-full.
SSL_MODE = disable
; Maximum number of open connections to the database.
MAX_OPEN_CONNS = 25
; Maximum number of idle connections in the pool.
MAX_IDLE_CONNS = 25
; Maximum lifetime of a connection in minutes. Connections older than this are
; closed and replaced. Set to 0 to disable.
CONN_MAX_LIFETIME = 30
; Maximum idle time of a connection in minutes. Idle connections older than this
; are closed. Set to 0 to disable.
CONN_MAX_IDLE_TIME = 5

[storage "local"]
; Filesystem path where local LFS objects are stored.
ROOT = .data/objects
; Filesystem path for temporary files during upload. Must live on the same
; filesystem as ROOT (atomic rename requirement).
TEMP_DIR = %(ROOT)s/.tmp

; Example forge configuration. Uncomment and adjust, or add your own in the
; override config file. At least one forge must be configured.
; [forge "github.com"]
; TYPE = github
; STORAGE = local
; Set true to bypass forge token verification entirely.
; SKIP_AUTH = false

[log]
; Default log level: debug, info, warn, error.
LEVEL = debug
